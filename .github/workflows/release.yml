name: Release

# Builds the release files for a version tag, adds checksums and build provenance, and opens a draft release.
# A maintainer reviews the draft, including what was tested on real hardware, before publishing it
# (docs/releasing.md, PRD section 9.4).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Versions match the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          launcher=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' launcher/build.gradle.kts)
          desktop=$(sed -n 's/.*packageVersion = "\(.*\)".*/\1/p' control-center/build.gradle.kts)
          if [ "$launcher" != "$version" ] || [ "$desktop" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the launcher ($launcher) and Control Center ($desktop) versions."
            exit 1
          fi
          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## [$version]\" section."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  launcher:
    name: Launcher APK
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_KEYSTORE: ${{ secrets.ORIEL_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ORIEL_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oriel-release.jks"
          echo "ORIEL_KEYSTORE_FILE=$RUNNER_TEMP/oriel-release.jks" >> "$GITHUB_ENV"
      - name: Test, check licenses, lint, and build
        env:
          ORIEL_KEYSTORE_PASSWORD: ${{ secrets.ORIEL_KEYSTORE_PASSWORD }}
          ORIEL_KEY_ALIAS: ${{ secrets.ORIEL_KEY_ALIAS }}
          ORIEL_KEY_PASSWORD: ${{ secrets.ORIEL_KEY_PASSWORD }}
        run: ./gradlew :launcher:testDebugUnitTest :launcher:licenseeRelease :launcher:lintRelease :launcher:assembleRelease --console=plain
      - name: Name the APK
        run: |
          mkdir dist
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp launcher/build/outputs/apk/release/launcher-release.apk "dist/oriel-launcher-$VERSION.apk"
          else
            cp launcher/build/outputs/apk/release/launcher-release-unsigned.apk "dist/oriel-launcher-$VERSION-unsigned.apk"
          fi
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/oriel-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: dist/*

  control-center:
    name: Control Center (${{ matrix.label }})
    needs: version
    strategy:
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            task: packageDeb
            files: control-center/build/compose/binaries/main/deb/*.deb
          - label: Windows
            os: windows-latest
            task: packageMsi
            files: control-center/build/compose/binaries/main/msi/*.msi
          - label: macOS
            os: macos-latest
            task: packageUberJarForCurrentOS
            files: control-center/build/compose/jars/*.jar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, check licenses, and package
        run: ./gradlew :shared:device:test :control-center:test :control-center:licensee :control-center:${{ matrix.task }} --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: control-center-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    name: Draft release
    needs: [version, launcher, control-center]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Release notes from the changelog
        run: |
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## [" version "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo
            if ls dist/*-unsigned.apk > /dev/null 2>&1; then
              echo "**This draft's APK is unsigned**, because the signing secrets aren't set. Android won't install it. Don't publish this draft; see docs/releasing.md."
              echo
            fi
            echo "Check downloads against \`SHA256SUMS.txt\` with \`sha256sum -c SHA256SUMS.txt\`. Every file also has a build provenance attestation: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            echo
            echo "Before publishing, state which devices this release was tested on. Never mark a device as tested unless someone tested it."
          } >> notes.md
          cat notes.md
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "Oriel TV $VERSION" --notes-file notes.md
