name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contrast and generator tests
        run: npm run test:tokens
      - name: Generated files are up to date
        run: npm run tokens:check

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Every production dependency uses an allowed license
        run: npm run check:licenses
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Every required route and internal link exists
        run: npm run check:routes

  launcher:
    name: Launcher and Control Center
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, dependency licenses, lint, and debug build
        run: ./gradlew :shared:device:test :shared:device:licensee :control-center:test :control-center:licensee :launcher:testDebugUnitTest :launcher:licenseeRelease :launcher:lintDebug :launcher:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-reports
          path: |
            launcher/build/reports/
            launcher/build/test-results/
            shared/device/build/reports/
            control-center/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-debug-apk
          path: launcher/build/outputs/apk/debug/*.apk
