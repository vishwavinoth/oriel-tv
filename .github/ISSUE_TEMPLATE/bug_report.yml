name: Bug report
description: Something in Oriel TV doesn't work as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search existing issues first.
        For security problems, don't open an issue. Follow [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Launcher
        - Control Center
        - Website
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. Choose a wallpaper
        3. Press Back
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system version
      description: For launcher bugs, the TV or streaming device and its Android or Google TV version. For website bugs, the browser and version.
      placeholder: "e.g. Chromecast with Google TV (4K), Google TV on Android 14"
  - type: input
    id: version
    attributes:
      label: Oriel version or commit
      placeholder: "e.g. 0.1.0 or a1b2c3d"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove serial numbers, account names, and network details before pasting.
      render: text
